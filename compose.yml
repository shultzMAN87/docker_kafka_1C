# =====================================================================
# Kafka-кластер для тестов: 3 ноды KRaft + веб-админка Kafka UI
#
#   kafka-0 ─┐
#   kafka-1 ─┼── кластер (каждая нода — broker + controller, без ZooKeeper)
#   kafka-2 ─┘
#   kafka-ui    — веб-интерфейс, http://localhost:8080
# =====================================================================

x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:8.1.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9091"]
    interval: 10s
    timeout: 10s
    retries: 15
    start_period: 30s
  environment: &kafka-common-env
    CLUSTER_ID: ZETVJENWRjaECDUEExP_eg
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_LISTENERS: INTERNAL://:9091,EXTERNAL://:29092,CONTROLLER://:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
    # Служебные и новые топики реплицируются на все три брокера
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS:-true}
    # Для тестового стенда — без задержки первого ребаланса
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    # Ограничение памяти JVM на брокер
    KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}

services:

  kafka-0:
    <<: *kafka-common
    container_name: kafka-0
    hostname: kafka-0
    ports:
      - "${KAFKA_0_PORT:-29092}:29092"
    volumes:
      - kafka-0-data:/var/lib/kafka/data
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 0
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-0:9091,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_0_PORT:-29092}

  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "${KAFKA_1_PORT:-29093}:29092"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9091,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_1_PORT:-29093}

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "${KAFKA_2_PORT:-29094}:29092"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9091,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_2_PORT:-29094}

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka-0: { condition: service_healthy }
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTER_NAME:-local}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-0:9091,kafka-1:9091,kafka-2:9091
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  kafka-0-data:
  kafka-1-data:
  kafka-2-data:
